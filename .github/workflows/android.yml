name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Debug build + Lint + Unit test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug, lint and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  e2e-contract:
    name: E2E contract (fixture Go backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 与 verify 并行；只在 push 与 PR 触发，不阻塞普通构建 job。
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout app
        uses: actions/checkout@v7

      - name: Checkout PJGoIoT
        uses: actions/checkout@v7
        with:
          repository: platojobs/PJGoIoT
          path: PJGoIoT

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: PJGoIoT/go.mod
          cache: true
          cache-dependency-path: PJGoIoT/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew ./scripts/e2e-contract.sh

      - name: Run e2e contract against fixture backend
        env:
          PJGOIOT_DIR: ${{ github.workspace }}/PJGoIoT
          E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
          E2E_LOG_LEVEL: info
        run: ./scripts/e2e-contract.sh

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-contract-report
          path: |
            app/build/reports/tests/e2eContract
            app/build/test-results/e2eContract
          if-no-files-found: warn

      - name: Upload Go service log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-go-service-log
          path: e2e-logs
          if-no-files-found: ignore

  release:
    name: Unsigned release build (tags / manual only)
    needs: verify
    # 只有打 tag 或手动触发时才跑 release，避免每次 push 都执行 R8 + 签名流程
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 仓库内不提供 keystore.properties 时，signingConfig 为空，
      # 产物为未签名的 app-release-unsigned.apk，不会把密码写进 CI。
      # 如需正式签名，请在仓库 Secrets 中配置并自行补充 signingConfig 注入步骤。
      - name: Assemble release (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
