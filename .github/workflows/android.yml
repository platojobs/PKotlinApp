name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Debug build + Lint + Unit test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug, lint and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  e2e-contract:
    name: E2E contract (fixture Go backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 与 verify 并行；只在 push 与 PR 触发，不阻塞普通构建 job。
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout app
        uses: actions/checkout@v7

      - name: Checkout PJGoIoT
        uses: actions/checkout@v7
        with:
          repository: platojobs/PJGoIoT
          path: PJGoIoT

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: PJGoIoT/go.mod
          cache: true
          cache-dependency-path: PJGoIoT/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew ./scripts/e2e-contract.sh

      - name: Run e2e contract against fixture backend
        env:
          PJGOIOT_DIR: ${{ github.workspace }}/PJGoIoT
          E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
          E2E_LOG_LEVEL: info
        run: ./scripts/e2e-contract.sh

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-contract-report
          path: |
            app/build/reports/tests/e2eContract
            app/build/test-results/e2eContract
          if-no-files-found: warn

      - name: Upload Go service log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-go-service-log
          path: e2e-logs
          if-no-files-found: ignore

  e2e-postgres:
    name: E2E contract (real Postgres + Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 与 fixture e2e 并行，不阻塞 verify / release 主流程。
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout app
        uses: actions/checkout@v7

      - name: Checkout PJGoIoT
        uses: actions/checkout@v7
        with:
          repository: platojobs/PJGoIoT
          path: PJGoIoT

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: PJGoIoT/go.mod
          cache: true
          cache-dependency-path: PJGoIoT/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x ./gradlew ./scripts/e2e-postgres.sh PJGoIoT/scripts/stack-for-e2e.sh PJGoIoT/scripts/seed-for-e2e.sh

      - name: Run e2e contract against real Postgres
        env:
          PJGOIOT_DIR: ${{ github.workspace }}/PJGoIoT
          E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
        run: ./scripts/e2e-postgres.sh

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-postgres-report
          path: |
            app/build/reports/tests/e2ePostgres
            app/build/test-results/e2ePostgres
          if-no-files-found: warn

      - name: Upload Postgres service log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-postgres-service-log
          path: e2e-logs
          if-no-files-found: ignore

  release:
    name: Signed release build (self-signed, tags / manual only)
    needs: verify
    # 只有打 tag 或手动触发时才跑 release，避免每次 push 都执行 R8 + 签名流程
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew and keystore script
        run: chmod +x ./gradlew ./scripts/make-upload-keystore.sh

      # 每次 CI 现场生成一次性自签名密钥：密码来自 openssl，不写进仓库、不落 artifacts。
      # 该证书只用于验证签名构建链路，不能用于 Google Play 上传。
      - name: Generate ephemeral self-signed keystore
        run: |
          set -euo pipefail
          export KEY_ALIAS=ci-selfsigned
          export KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          ./scripts/make-upload-keystore.sh --non-interactive

      - name: Assemble signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify signed release artifacts
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          test -f app/build/outputs/mapping/release/mapping.txt
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # debuggable 为 false 时 badging 不输出 application-debuggable。
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          if grep -q "application-debuggable" <<<"$BADGING"; then
            echo "release APK 仍带 application-debuggable" >&2
            exit 1
          fi

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
